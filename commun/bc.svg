  <circle cx="32" cy="24" r="13" fill="#e3b528"/>
  <g fill="none" stroke="#fbfbfa" stroke-width="2.4">
    <path d="M0,41 q8,-3.2 16,0 t16,0 t16,0 t16,0"/>
    <path d="M0,47 q8,-3.2 16,0 t16,0 t16,0 t16,0"/>
  </g>
  <rect y="52" width="64" height="12" fill="#e3b528"/>
</svg>
